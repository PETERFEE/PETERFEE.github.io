name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-run a deploy by hand from the Actions tab.
  workflow_dispatch:

# Required by the official Pages deployment action.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue them instead of cancelling a live one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # `npm install` rather than `npm ci` so this works even before you have
      # committed package-lock.json. Once the lockfile is in the repo you can
      # switch to `npm ci` for reproducible builds.
      - run: npm install

      # PROJECT SITE ONLY (repo not named peterfee.github.io):
      # uncomment the two lines below and set the value to "/<your-repo-name>".
      # env:
      #   NEXT_PUBLIC_BASE_PATH: /portfolio
      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
